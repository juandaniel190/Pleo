<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pleo RevOps — Weekly GTM Review</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>
<style>
  /* Pleo Telescope · Neue Haas Grotesk Display · shade100 background */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Neue Haas Grotesk Display", system-ui, "Helvetica Neue", Arial, sans-serif;
    font-weight: 400; font-size: 14px;
    background: #FAFAFA; color: #000000;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  h1, h2, h3 { margin: 0; font-weight: 400; }
  table { border-collapse: collapse; }
  .recharts-cartesian-axis-tick text {
    font-family: "Neue Haas Grotesk Display", system-ui, "Helvetica Neue", Arial, sans-serif;
  }
  ::selection { background: #000000; color: #FFFFFF; }

  /* ── Responsive layout classes ───────────────────── */
  .grid-4       { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
  .body-wrap    { max-width: 1180px; margin: 0 auto; padding: 0 40px 80px; }
  .hero-pad     { padding: 72px 40px 64px; }
  .panel-pad    { padding: 32px 32px 36px; }
  .tbl-scroll   { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 14px; }
  .actions-row  {
    display: grid; grid-template-columns: 1fr 180px 160px 100px;
    gap: 16px; padding: 20px 24px; align-items: center;
  }
  @media (max-width: 768px) {
    .grid-4      { grid-template-columns: repeat(2,1fr); }
    .body-wrap   { padding: 0 16px 48px; }
    .hero-pad    { padding: 40px 20px 36px; }
    .panel-pad   { padding: 20px 16px 24px; }
    .actions-row { grid-template-columns: 1fr; padding: 16px; gap: 6px; }
    .hero-h1     { font-size: 28px !important; }
    .hero-num    { font-size: 22px !important; }
    .hero-para   { font-size: 13px !important; }
    .sec-title   { font-size: 24px !important; }
  }
  @media (max-width: 480px) {
    .grid-4 { grid-template-columns: 1fr 1fr; gap: 8px; }
  }

  /* Loading state shown until DuckDB-WASM has resolved every query. */
  #loader {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #FAFAFA; color: #000; font: 400 14px/1.4 "Neue Haas Grotesk Display", system-ui, sans-serif;
    letter-spacing: 0.02em; flex-direction: column; gap: 12px; z-index: 1;
  }
  #loader .dot {
    width: 8px; height: 8px; border-radius: 999px; background: #000;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  #loader.err { color: #c00; }
</style>
</head>
<body>
<div id="loader">
  <div class="dot"></div>
  <div id="loader-msg">Querying the marts…</div>
</div>
<div id="root"></div>

<!-- App template — kept inert until data is ready. Babel transforms it on demand. -->
<script id="app-jsx" type="text/plain">
// Pleo RevOps dashboard — React + Recharts, rendered at runtime via Babel.
//
// Design intent (per Daniel's direction):
//   - Pleo Telescope palette (no Finstatement / monochrome).
//   - Warm cream background like Pleo's marketing site.
//   - Switzer (Telescope official typeface). Numbers use tabular-nums.
//   - Section cards live on a light grey panel; cards inside are white.
//   - Pleo brand pastels (yellow / green / pink / purple) appear ONLY on
//     specific data callouts (status pills, tiny accent dots, the won
//     funnel bar). Everything else is black / grey / white.
//   - Less colour overall; the eye should land on the numbers that matter.

const { useState, useMemo, useEffect } = React;

function useBreakpoint() {
  const [w, setW] = useState(window.innerWidth);
  useEffect(() => {
    const h = () => setW(window.innerWidth);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);
  return { isMobile: w < 768, isNarrow: w < 480 };
}

if (typeof Recharts === 'undefined') {
  document.getElementById('root').innerHTML =
    '<div style="padding:40px;font-family:sans-serif;color:#c00"><strong>Error:</strong> Recharts CDN failed to load. Serve via HTTP, not file://.<br><code>python3 -m http.server 8000</code></div>';
  throw new Error('Recharts not loaded');
}

const {
  BarChart, Bar, LineChart, Line, ComposedChart, XAxis, YAxis, Tooltip, Legend,
  ResponsiveContainer, CartesianGrid, Cell, LabelList
} = Recharts;

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) return (
      <div style={{ padding: 40, fontFamily: 'sans-serif', color: '#c00' }}>
        <strong>Render error:</strong> {this.state.error.message}
        <pre style={{ marginTop: 12, fontSize: 12 }}>{this.state.error.stack}</pre>
      </div>
    );
    return this.props.children;
  }
}

// --- Design tokens (Pleo Telescope) ---------------------------------------

const T = {
  // Surfaces — Telescope design tokens (light mode)
  bg:         '#FAFAFA',  // shade100 — page background
  panel:      '#F5F5F5',  // shade200 — section grouping panel
  card:       '#FFFFFF',  // card / table fill
  hairline:   '#ECECEC',  // shade300 — borders & dividers

  // Text — Telescope tokens
  black:      '#000000',  // shade900
  textSec:    '#333333',  // shade700
  textMuted:  '#737373',  // shade600

  // Status
  positive:   '#2c8354',  // green800
  negative:   '#e91c1c',  // red700

  // Pleo brand pastels — reserved for tiny accents only
  pleoYellow: '#fcea88',  // yellow500
  pleoGreen:  '#ace3bd',  // green500
  pleoPink:   '#f39ca8',  // pink500
  pleoPurple: '#a69ae3',  // purple500

  // Chart
  chartGrid:  '#ECECEC',  // shade300

  // Telescope type scale
  fontXSmall:   10,
  fontSmall:    12,
  fontMedium:   14,
  fontLarge:    16,
  fontXLarge:   18,
  font2XLarge:  20,
  font3XLarge:  24,
  font4XLarge:  32,
  font5XLarge:  48,

  // Telescope font weights
  fontWeightRegular:   400,
  fontWeightMedium:    500,
  fontWeightSemibold:  600,
  fontWeightBold:      700,

  // Telescope line heights
  lineHeight1: 1.4,
  lineHeight2: 1.6,
  lineHeight3: 1.7,

  // Font family — Pleo production stack
  font: '"Neue Haas Grotesk Display", system-ui, "Helvetica Neue", Arial, sans-serif',
};

const numStyle = { fontVariantNumeric: 'tabular-nums', fontFeatureSettings: '"tnum"' };

const fmtEur = (n) => {
  if (n === null || n === undefined) return '—';
  if (Math.abs(n) >= 1000) return '€' + Math.round(n / 1000).toLocaleString() + 'K';
  return '€' + Math.round(n).toLocaleString();
};

// --- Primitives -----------------------------------------------------------

const Pill = ({ kind, children }) => {
  // Quiet pills — no full-saturation backgrounds. Just a coloured dot + label
  // in slightly tinted text. The screen stays calm; pills don't shout.
  const colours = {
    positive: T.positive,
    negative: T.negative,
    neutral:  T.textMuted,
  };
  const c = colours[kind || 'neutral'];
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      fontSize: T.fontSmall, fontWeight: T.fontWeightRegular, color: c, ...numStyle,
    }}>
      <span style={{ width: 6, height: 6, borderRadius: 999, background: c, display: 'inline-block' }} />
      {children}
    </span>
  );
};

const KpiCard = ({ label, value, sub, emphasised }) => (
  // The "emphasised" prop just bolds the number a touch — no colour change.
  <div style={{
    background: T.card, borderRadius: 14, padding: '22px 24px',
  }}>
    <div style={{ fontSize: T.fontXSmall, color: T.textMuted, textTransform: 'uppercase',
                  letterSpacing: '0.06em', fontWeight: T.fontWeightRegular, marginBottom: 14 }}>{label}</div>
    <div style={{ ...numStyle, fontSize: T.font4XLarge, fontWeight: emphasised ? T.fontWeightSemibold : T.fontWeightMedium,
                  color: T.black, lineHeight: T.lineHeight1, letterSpacing: '-0.02em' }}>{value}</div>
    {sub && <div style={{ fontSize: 12, color: T.textMuted, marginTop: 10, lineHeight: 1.5 }}>{sub}</div>}
  </div>
);

const SectionBanner = ({ tag, title, caption, who }) => (
  <div style={{ marginTop: 64, marginBottom: 24 }}>
    <div style={{ fontSize: 10, color: T.textMuted, textTransform: 'uppercase',
                  letterSpacing: '0.14em', fontWeight: T.fontWeightRegular, marginBottom: 8 }}>{tag}</div>
    <h2 className="sec-title" style={{ margin: 0, fontSize: T.font4XLarge, fontWeight: T.fontWeightRegular,
                 color: T.black, letterSpacing: '-0.02em', lineHeight: T.lineHeight1 }}>{title}</h2>
    {caption && (
      <div style={{ fontSize: T.fontMedium, color: T.textSec, marginTop: 10, lineHeight: T.lineHeight2, maxWidth: 760 }}>
        {caption}
      </div>
    )}
    {who && (
      <div style={{ fontSize: 11, color: T.textMuted, marginTop: 12,
                    textTransform: 'uppercase', letterSpacing: '0.05em' }}>
        Audience · {who}
      </div>
    )}
  </div>
);

const SectionH = ({ children, meta }) => (
  <div style={{ fontSize: 11, color: T.textMuted, textTransform: 'uppercase',
                letterSpacing: '0.12em', fontWeight: T.fontWeightRegular, marginTop: 32, marginBottom: 14 }}>
    {children}
    {meta && <span style={{ marginLeft: 10, color: T.textMuted, opacity: 0.7,
                            textTransform: 'none', letterSpacing: 0, fontWeight: 400 }}>{meta}</span>}
  </div>
);

const FindingBox = ({ children }) => (
  // No coloured strip, no coloured background. Just a quiet quote-style
  // indent — the words carry the weight.
  <div style={{
    padding: '14px 0 14px 20px',
    margin: '16px 0 4px',
    borderLeft: `2px solid ${T.hairline}`,
    fontSize: T.fontMedium, lineHeight: T.lineHeight2, color: T.textSec,
  }}>{children}</div>
);

const Card = ({ children, style }) => (
  <div style={{ background: T.card, borderRadius: 14, padding: 24, ...style }}>{children}</div>
);

const Table = ({ headers, rows, formatters }) => (
  <div className="tbl-scroll">
  <div style={{ background: T.card, minWidth: 480 }}>
    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 14 }}>
      <thead>
        <tr>
          {headers.map((h, i) => (
            <th key={i} style={{
              textAlign: h.align || 'left', padding: '14px 20px',
              fontSize: T.fontXSmall, color: T.textMuted, textTransform: 'uppercase',
              letterSpacing: '0.06em', fontWeight: T.fontWeightRegular,
              borderBottom: `1px solid ${T.hairline}`,
            }}>{h.label}</th>
          ))}
        </tr>
      </thead>
      <tbody>
        {rows.map((r, i) => (
          <tr key={i}>
            {headers.map((h, j) => {
              const v = r[h.key];
              const cell = formatters && formatters[h.key] ? formatters[h.key](v, r) : v;
              return (
                <td key={j} style={{
                  padding: '12px 20px', textAlign: h.align || 'left',
                  color: h.muted ? T.textMuted : T.textSec,
                  fontWeight: h.bold ? 600 : 400,
                  borderTop: i > 0 ? `1px solid ${T.hairline}` : 'none',
                  ...(h.numeric ? numStyle : {}),
                }}>{cell}</td>
              );
            })}
          </tr>
        ))}
      </tbody>
    </table>
  </div>
  </div>
);

// --- Hero -----------------------------------------------------------------

function HeroSection({ data }) {
  const h = data.hero;
  return (
    <section className="hero-pad" style={{ background: T.black, color: '#FFFFFF' }}>
      <div style={{ maxWidth: 1180, margin: '0 auto' }}>
        <div style={{ fontSize: T.fontXSmall, color: 'rgba(255,255,255,0.55)',
                      textTransform: 'uppercase', letterSpacing: '0.14em',
                      fontWeight: T.fontWeightRegular, marginBottom: 12 }}>
          Weekly GTM Performance Review · {h.asOf}
        </div>
        <h1 className="hero-h1" style={{ margin: 0, fontSize: T.font5XLarge, fontWeight: T.fontWeightRegular,
                     letterSpacing: '-0.03em', lineHeight: 1.1, color: '#FFFFFF', marginBottom: 20 }}>
          Q2 2026 is behind plan.
        </h1>
        <div className="hero-num" style={{ ...numStyle, fontSize: T.font4XLarge, fontWeight: T.fontWeightSemibold,
                      color: T.pleoYellow, lineHeight: 1.1, letterSpacing: '-0.02em',
                      marginBottom: 24 }}>
          €0 closed of {fmtEur(h.q2Target)}
        </div>
        <p className="hero-para" style={{ fontSize: T.fontLarge, lineHeight: T.lineHeight2, maxWidth: 720,
                    opacity: 0.78, margin: '0 0 40px', color: '#FFFFFF' }}>
          Six weeks into Q2, we have closed €0 of a ramp-adjusted {fmtEur(h.q2Target)} target.
          Pipeline scheduled to close in Q2 is {fmtEur(h.q2PipeGross)} gross / {fmtEur(h.q2PipeWeighted)}{' '}
          weighted — even if every weighted euro lands, we miss target by {fmtEur(h.q2Target - h.q2PipeWeighted)}.
          The biggest controllable lever this week is the {h.staleDeals} open deals worth {fmtEur(h.staleArr)} with
          no activity in 30+ days.
        </p>
        <div className="grid-4">
          {[
            { label: 'Q2 ARR pace',         value: fmtEur(h.q2Closed),         sub: `${fmtEur(h.q2Gap)} behind plan` },
            { label: 'Pipeline at risk',    value: fmtEur(h.staleArr),         sub: `${h.staleDeals} stale · ${h.staleAvgSilent}d avg silent` },
            { label: 'Q2 weighted pipeline',value: fmtEur(h.q2PipeWeighted),   sub: `${fmtEur(h.q2PipeGross)} gross` },
            { label: 'Recovery upside',     value: `+${fmtEur(h.recoveryEur)}`, sub: 'Stale re-engagement · 45d' },
          ].map((k, i) => (
            <div key={i} style={{ background: 'rgba(255,255,255,0.06)',
                                  borderRadius: 12, padding: '20px 22px' }}>
              <div style={{ fontSize: T.fontXSmall, color: 'rgba(255,255,255,0.55)',
                            textTransform: 'uppercase', letterSpacing: '0.06em',
                            fontWeight: T.fontWeightRegular, marginBottom: 12 }}>{k.label}</div>
              <div style={{ ...numStyle, fontSize: T.font3XLarge, fontWeight: T.fontWeightMedium, color: '#FFFFFF',
                            lineHeight: 1.1, letterSpacing: '-0.02em' }}>{k.value}</div>
              <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.65)',
                            marginTop: 10, lineHeight: 1.5 }}>{k.sub}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

// --- Charts ---------------------------------------------------------------

const TooltipBox   = { background: '#000000', border: 'none', borderRadius: 6, fontSize: 12, padding: '8px 10px' };
const TooltipLabel = { color: '#FFF' };
const TooltipItem  = { color: '#FFF' };

function TrendChart({ data }) {
  const points = data.trend.filter(r => r.quarter >= '2025 Q1');
  return (
    <Card>
      <ResponsiveContainer width="100%" height={260}>
        <BarChart data={points} margin={{ top: 8, right: 8, left: -10, bottom: 0 }}>
          <CartesianGrid strokeDasharray="2 4" vertical={false} stroke={T.chartGrid} />
          <XAxis dataKey="quarter" tick={{ fontSize: 11, fill: T.textMuted }} axisLine={false} tickLine={false} />
          <YAxis tickFormatter={(v) => `€${v}K`} tick={{ fontSize: 11, fill: T.textMuted }} axisLine={false} tickLine={false} />
          <Tooltip formatter={(v) => `€${v}K`} contentStyle={TooltipBox} labelStyle={TooltipLabel} itemStyle={TooltipItem} />
          <Legend wrapperStyle={{ fontSize: 12 }} />
          <Bar dataKey="target_k" name="Target"     fill={T.hairline} radius={[4,4,0,0]} />
          <Bar dataKey="closed_k" name="Closed-won" fill={T.black}    radius={[4,4,0,0]} />
        </BarChart>
      </ResponsiveContainer>
    </Card>
  );
}

function CumulativeArrChart({ data }) {
  const points = data.cumulativeArr.filter(r => r.month <= '2026-06-01');
  return (
    <Card>
      <ResponsiveContainer width="100%" height={300}>
        <ComposedChart data={points} margin={{ top: 8, right: 30, left: -10, bottom: 0 }}>
          <CartesianGrid strokeDasharray="2 4" vertical={false} stroke={T.chartGrid} />
          <XAxis dataKey="month" tick={{ fontSize: 10, fill: T.textMuted }} axisLine={false} tickLine={false}
                 tickFormatter={(v) => v.substring(0, 7)} interval={2} />
          <YAxis yAxisId="left"  tickFormatter={(v) => `€${Math.round(v/1000)}K`} tick={{ fontSize: 11, fill: T.textMuted }} axisLine={false} tickLine={false} />
          <YAxis yAxisId="right" orientation="right" tickFormatter={(v) => `€${Math.round(v/1000)}K`} tick={{ fontSize: 11, fill: T.textMuted }} axisLine={false} tickLine={false} />
          <Tooltip formatter={(v) => `€${Math.round(v/1000).toLocaleString()}K`} contentStyle={TooltipBox} labelStyle={TooltipLabel} itemStyle={TooltipItem} />
          <Legend wrapperStyle={{ fontSize: 12 }} />
          <Bar  yAxisId="left"  dataKey="new_arr_eur"        name="New ARR booked"        fill={T.hairline} radius={[3,3,0,0]} />
          <Line yAxisId="right" dataKey="cumulative_arr_eur" name="Cumulative (no churn)" stroke={T.black} strokeWidth={2} dot={{ r: 2, fill: T.black }} />
        </ComposedChart>
      </ResponsiveContainer>
    </Card>
  );
}

function AspBySource({ data }) {
  const rows = data.aspBySource.map(r => ({ ...r, asp_keur: Math.round(r.asp_eur / 1000) }));
  return (
    <Card>
      <ResponsiveContainer width="100%" height={250}>
        <BarChart data={rows} margin={{ top: 20, right: 8, left: -10, bottom: 0 }}>
          <CartesianGrid strokeDasharray="2 4" vertical={false} stroke={T.chartGrid} />
          <XAxis dataKey="demand_source" tick={{ fontSize: 12, fill: T.textMuted }} axisLine={false} tickLine={false} />
          <YAxis tickFormatter={(v) => `€${v}K`} tick={{ fontSize: 11, fill: T.textMuted }} axisLine={false} tickLine={false} />
          <Tooltip formatter={(v) => `€${v}K ASP`} contentStyle={TooltipBox} labelStyle={TooltipLabel} itemStyle={TooltipItem} />
          <Bar dataKey="asp_keur" fill={T.black} radius={[4,4,0,0]}>
            <LabelList dataKey="asp_keur" position="top" formatter={(v) => `€${v}K`} fontSize={11} fontWeight={600} fill={T.black} />
          </Bar>
        </BarChart>
      </ResponsiveContainer>
    </Card>
  );
}

function VelocityByStage({ data }) {
  return (
    <Card>
      <ResponsiveContainer width="100%" height={280}>
        <BarChart layout="vertical" data={data.velocity} margin={{ top: 8, right: 50, left: 50, bottom: 0 }}>
          <CartesianGrid strokeDasharray="2 4" horizontal={false} stroke={T.chartGrid} />
          <XAxis type="number" tick={{ fontSize: 11, fill: T.textMuted }} axisLine={false} tickLine={false} />
          <YAxis dataKey="stage" type="category" tick={{ fontSize: 11, fill: T.textSec }} width={140} axisLine={false} tickLine={false} />
          <Tooltip formatter={(v) => `${v} days`} contentStyle={TooltipBox} labelStyle={TooltipLabel} itemStyle={TooltipItem} />
          <Bar dataKey="avg_days" fill={T.black} radius={[0,4,4,0]}>
            <LabelList dataKey="avg_days" position="right" formatter={(v) => `${v}d`} fontSize={11} fontWeight={600} fill={T.black} />
          </Bar>
        </BarChart>
      </ResponsiveContainer>
    </Card>
  );
}

function StaleBySegmentChart({ data }) {
  const rows = data.staleBySegment.slice(0, 10).map(r => ({ ...r, label: `${r.market} · ${r.segment}` }));
  return (
    <Card>
      <ResponsiveContainer width="100%" height={320}>
        <BarChart layout="vertical" data={rows} margin={{ top: 8, right: 60, left: 100, bottom: 0 }}>
          <CartesianGrid strokeDasharray="2 4" horizontal={false} stroke={T.chartGrid} />
          <XAxis type="number" tickFormatter={(v) => `€${v}K`} tick={{ fontSize: 11, fill: T.textMuted }} axisLine={false} tickLine={false} />
          <YAxis dataKey="label" type="category" tick={{ fontSize: 11, fill: T.textSec }} width={100} axisLine={false} tickLine={false} />
          <Tooltip formatter={(v) => `€${v}K`} contentStyle={TooltipBox} labelStyle={TooltipLabel} itemStyle={TooltipItem} />
          <Bar dataKey="arr_keur" fill={T.black} radius={[0,4,4,0]}>
            <LabelList dataKey="arr_keur" position="right" formatter={(v) => `€${v}K`} fontSize={11} fontWeight={600} fill={T.black} />
          </Bar>
        </BarChart>
      </ResponsiveContainer>
    </Card>
  );
}

function FunnelChart({ data }) {
  const rows = data.funnel.map((r, i) => {
    const prev = i > 0 ? data.funnel[i - 1].count : null;
    const conv = (prev && prev > 0) ? Math.round(r.count / prev * 100) : null;
    return { ...r, conv };
  });
  return (
    <Card>
      <ResponsiveContainer width="100%" height={260}>
        <BarChart data={rows} margin={{ top: 20, right: 8, left: -10, bottom: 0 }}>
          <CartesianGrid strokeDasharray="2 4" vertical={false} stroke={T.chartGrid} />
          <XAxis dataKey="stage" tick={{ fontSize: 12, fill: T.textMuted }} axisLine={false} tickLine={false} />
          <YAxis tick={{ fontSize: 11, fill: T.textMuted }} axisLine={false} tickLine={false} />
          <Tooltip contentStyle={TooltipBox} labelStyle={TooltipLabel} itemStyle={TooltipItem} />
          <Bar dataKey="count" radius={[4,4,0,0]}>
            {/* Only the "Won" bar gets a Pleo green accent — the one number that matters. */}
            {rows.map((r, i) => (
              <Cell key={i} fill={r.stage === 'Won' ? T.pleoGreen : T.black} />
            ))}
            <LabelList dataKey="count" position="top" fontSize={11} fontWeight={600} fill={T.black} />
          </Bar>
        </BarChart>
      </ResponsiveContainer>
      <div style={{ fontSize: 11, color: T.textMuted, marginTop: 12,
                    display: 'flex', justifyContent: 'space-around', flexWrap: 'wrap' }}>
        {rows.slice(1).map((r, i) => (
          <span key={i}>{rows[i].stage}→{r.stage}: <strong style={{ color: T.black }}>{r.conv}%</strong></span>
        ))}
      </div>
    </Card>
  );
}

function SlippageTrendChart({ data }) {
  return (
    <Card>
      <ResponsiveContainer width="100%" height={260}>
        <ComposedChart data={data.slippageTrend} margin={{ top: 8, right: 30, left: -10, bottom: 0 }}>
          <CartesianGrid strokeDasharray="2 4" vertical={false} stroke={T.chartGrid} />
          <XAxis dataKey="snapshot_month" tick={{ fontSize: 10, fill: T.textMuted }} axisLine={false} tickLine={false} />
          <YAxis yAxisId="left" tickFormatter={(v) => `€${v}K`} tick={{ fontSize: 11, fill: T.textMuted }} axisLine={false} tickLine={false} />

<!-- 1) Data layer: load DuckDB-WASM, mount parquets, run queries. -->
<script type="module">
// Runtime data layer for the Pleo dashboard.
//
// Loads DuckDB-WASM in the browser, mounts the parquet exports of each dbt
// mart, and runs all dashboard SQL right here. The result is shaped into
// `window.DATA` for the existing React/Recharts app to consume.
//
// Why this exists: previously `window.DATA` was a hardcoded JSON blob baked
// into index.html at build time. Now the dashboard genuinely queries the dbt
// marts at runtime — refresh the page and you see the latest numbers from the
// parquet files under `dashboard/data/`. No Python middleware required.

import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/+esm';

// ── Parquet files to register as tables ─────────────────────────────────────
// Names match the SQL identifiers we use below. The build script exports
// each mart with the same filename.
const TABLES = [
  'fct_quarterly_arr',
  'fct_pipeline_health',
  'fct_opportunities',
  'fct_rep_attainment',
  'fct_funnel_conversion',
  'fct_monthly_arr',
  'dim_accounts',
  'int_pipeline_stage_history',
];

const DATA_DIR = new URL('data/', window.location.href).href.replace(/\/$/, '');

// ── DuckDB-WASM bootstrap ───────────────────────────────────────────────────

async function bootDuckDB() {
  const bundles = duckdb.getJsDelivrBundles();
  const bundle = await duckdb.selectBundle(bundles);

  // Worker has to be served from a same-origin URL — wrap the CDN worker in a
  // blob URL so the browser accepts it.
  const workerUrl = URL.createObjectURL(
    new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' })
  );
  const worker = new Worker(workerUrl);
  const logger = new duckdb.ConsoleLogger();
  const db = new duckdb.AsyncDuckDB(logger, worker);
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  URL.revokeObjectURL(workerUrl);

  return db;
}

async function mountTables(db) {
  // Fetch each parquet as a full buffer and register it in-memory.
  // This avoids HTTP range requests (which Python's http.server doesn't support)
  // and works on any static host including GitHub Pages.
  const conn = await db.connect();
  await Promise.all(TABLES.map(async (t) => {
    const filename = `${t}.parquet`;
    const resp = await fetch(`${DATA_DIR}/${filename}`);
    if (!resp.ok) throw new Error(`Failed to fetch ${filename}: ${resp.status}`);
    const buf = await resp.arrayBuffer();
    await db.registerFileBuffer(filename, new Uint8Array(buf));
  }));
  for (const t of TABLES) {
    await conn.query(`CREATE OR REPLACE VIEW ${t} AS SELECT * FROM '${t}.parquet'`);
  }
  return conn;
}

// Convenience: turn an Arrow result into plain JS objects.
async function rows(conn, sql) {
  const result = await conn.query(sql);
  return result.toArray().map(r => r.toJSON());
}
async function one(conn, sql) {
  const r = await rows(conn, sql);
  return r[0] || {};
}

// Helper: round bigint/number safely (Arrow may return BigInts for INTs).
const num = (v) => v == null ? null : (typeof v === 'bigint' ? Number(v) : Number(v));

// ── Section queries — one per slice of window.DATA ──────────────────────────

async function buildHero(conn) {
  const q2  = await one(conn, `SELECT sum(target_eur) AS tgt, sum(closed_arr_eur) AS closed
                               FROM fct_quarterly_arr WHERE quarter = 'Q2 2026'`);
  const st  = await one(conn, `SELECT count(*)::int AS deals,
                                      sum(arr_eur) AS arr,
                                      sum(weighted_arr_eur) AS weighted,
                                      avg(days_since_last_activity) AS avg_silent
                               FROM fct_pipeline_health WHERE is_stale`);
  const pq2 = await one(conn, `SELECT sum(arr_eur) AS arr, sum(weighted_arr_eur) AS weighted
                               FROM fct_pipeline_health WHERE closes_in_q2_2026`);
  const wrR = await one(conn, `
    SELECT (count(*) FILTER (WHERE is_won))::double
           / nullif((count(*) FILTER (WHERE is_won OR is_lost)), 0) AS wr
    FROM fct_opportunities WHERE opp_created_date >= DATE '2024-01-01'`);

  const tgt   = num(q2.tgt);
  const close = num(q2.closed);
  const arr   = num(st.arr);
  const wr    = num(wrR.wr);

  return {
    asOf: '14 May 2026',
    q2Target:       Math.round(tgt),
    q2Closed:       Math.round(close),
    q2Gap:          Math.round(tgt - close),
    q2PipeGross:    Math.round(num(pq2.arr)),
    q2PipeWeighted: Math.round(num(pq2.weighted)),
    staleDeals:     num(st.deals),
    staleArr:       Math.round(arr),
    staleWeighted:  Math.round(num(st.weighted)),
    staleAvgSilent: Math.round(num(st.avg_silent)),
    winRatePct:     Math.round(wr * 100),
    recoveryEur:    Math.round(arr * 0.15 * wr),
  };
}

async function buildTrend(conn) {
  const r = await rows(conn, `
    SELECT right(quarter, 4) || ' ' || left(quarter, 2) AS quarter,
           round(sum(target_eur)/1000, 1)               AS target_k,
           round(sum(closed_arr_eur)/1000, 1)           AS closed_k
    FROM fct_quarterly_arr
    WHERE right(quarter, 4) IN ('2024','2025','2026')
    GROUP BY right(quarter, 4) || ' ' || left(quarter, 2)
    ORDER BY 1`);
  return r.map(x => ({ quarter: x.quarter, target_k: num(x.target_k), closed_k: num(x.closed_k) }));
}

async function buildPipelineQuality(conn) {
  const r = await one(conn, `
    SELECT
      (SELECT count(*) FROM fct_pipeline_health WHERE is_stale) AS stalled_deals,
      (SELECT sum(arr_eur) FROM fct_pipeline_health WHERE is_stale) AS stalled_arr,
      (SELECT count(*) FROM fct_pipeline_health WHERE close_date_slippage_days > 0) AS slipped_deals,
      (SELECT sum(arr_eur) FROM fct_pipeline_health WHERE close_date_slippage_days > 0) AS slipped_arr,
      (SELECT median(sales_cycle_days) FROM fct_opportunities WHERE is_won AND sales_cycle_days > 0) AS avg_cycle,
      (SELECT avg(arr_eur) FROM fct_opportunities WHERE is_won) AS asp_eur`);
  return {
    stalledDeals: num(r.stalled_deals),
    stalledArr:   Math.round(num(r.stalled_arr)),
    slippedDeals: num(r.slipped_deals),
    slippedArr:   Math.round(num(r.slipped_arr)),
    avgCycle:     r.avg_cycle != null ? Math.round(num(r.avg_cycle)) : null,
    aspEur:       r.asp_eur   != null ? Math.round(num(r.asp_eur)) : null,
  };
}

async function buildQualityFlags(conn) {
  const r = await rows(conn, `
    SELECT 'Stalled > 30d no activity' AS flag,
           count(*)::int AS deals,
           round(sum(arr_eur)/1000, 0) AS arr_keur,
           'Sales lead' AS flag_owner,
           'red' AS severity
      FROM fct_pipeline_health WHERE is_stale
    UNION ALL
    SELECT 'Slipped close date',
      count(*) FILTER (WHERE close_date_slippage_days > 0)::int,
      round(sum(arr_eur) FILTER (WHERE close_date_slippage_days > 0)/1000, 0),
      'Sales lead', 'red'
      FROM fct_pipeline_health
    UNION ALL
    SELECT 'Deals > 90d in stage',
      count(*) FILTER (WHERE stage_age_days > 90)::int,
      round(sum(arr_eur) FILTER (WHERE stage_age_days > 90)/1000, 0),
      'Sales lead', 'amber'
      FROM fct_pipeline_health
    UNION ALL
    SELECT 'No activity ever logged',
      count(*) FILTER (WHERE last_activity_date IS NULL)::int,
      coalesce(round(sum(arr_eur) FILTER (WHERE last_activity_date IS NULL)/1000, 0), 0),
      'RevOps', 'gray'
      FROM fct_pipeline_health`);
  return r.map(x => ({
    flag: x.flag, deals: num(x.deals), arr_keur: num(x.arr_keur),
    flag_owner: x.flag_owner, severity: x.severity,
  }));
}

async function buildAspBySource(conn) {
  const r = await rows(conn, `
    SELECT demand_source,
           count(*)::int AS won_deals,
           round(avg(arr_eur), 0) AS asp_eur,
           round(sum(arr_eur)/1000, 0) AS total_keur
    FROM fct_opportunities WHERE is_won
    GROUP BY 1 ORDER BY asp_eur DESC`);
  return r.map(x => ({
    demand_source: x.demand_source,
    won_deals: num(x.won_deals),
    asp_eur:   num(x.asp_eur),
    total_keur: num(x.total_keur),
  }));
}

async function buildVelocity(conn) {
  const r = await rows(conn, `
    WITH cleaned AS (
      SELECT h.opportunity_id, h.stage_age_days, o.stage AS stage
      FROM int_pipeline_stage_history h
      JOIN fct_opportunities o USING (opportunity_id)
      WHERE h.stage_age_days > 0 AND o.stage NOT IN ('Closed Won', 'Closed Lost')
    )
    SELECT stage,
           round(avg(stage_age_days), 1) AS avg_days,
           count(DISTINCT opportunity_id)::int AS opps
    FROM cleaned GROUP BY 1 ORDER BY avg_days DESC`);
  return r.map(x => ({ stage: x.stage, avg_days: num(x.avg_days), opps: num(x.opps) }));
}

async function buildTopStale(conn) {
  const r = await rows(conn, `
    SELECT account_name, rep_name, market, segment, stage,
           round(arr_eur/1000, 1) AS arr_keur,
           days_since_last_activity AS days_silent
    FROM fct_pipeline_health WHERE is_stale
    ORDER BY arr_eur DESC LIMIT 12`);
  return r.map(x => ({
    account_name: x.account_name, rep_name: x.rep_name,
    market: x.market, segment: x.segment, stage: x.stage,
    arr_keur: num(x.arr_keur), days_silent: num(x.days_silent),
  }));
}

async function buildStaleBySegment(conn) {
  const r = await rows(conn, `
    SELECT market, segment, count(*)::int AS deals,
           round(sum(arr_eur)/1000, 0) AS arr_keur
    FROM fct_pipeline_health WHERE is_stale
    GROUP BY 1, 2 ORDER BY arr_keur DESC`);
  return r.map(x => ({ market: x.market, segment: x.segment, deals: num(x.deals), arr_keur: num(x.arr_keur) }));
}

async function buildFunnel(conn) {
  const r = await one(conn, `
    SELECT sum(leads)::int AS leads, sum(mqls)::int AS mqls, sum(sqls)::int AS sqls,
           sum(demos)::int AS demos, sum(opps)::int AS opps, sum(won)::int AS won
    FROM fct_funnel_conversion WHERE event_month >= DATE '2026-02-01'`);
  return [
    { stage: 'Leads', count: num(r.leads) },
    { stage: 'MQL',   count: num(r.mqls) },
    { stage: 'SQL',   count: num(r.sqls) },
    { stage: 'Demo',  count: num(r.demos) },
    { stage: 'Opp',   count: num(r.opps) },
    { stage: 'Won',   count: num(r.won) },
  ];
}

async function buildFunnelBySource(conn) {
  const r = await rows(conn, `
    SELECT demand_source, segment,
           sum(leads)::int AS leads,
           sum(opps)::int  AS opps,
           sum(won)::int   AS won,
           round(sum(won_arr_eur)/1000, 0) AS won_keur,
           CASE WHEN sum(leads) > 0
                THEN round(sum(won)::double/sum(leads)*100, 1) END AS lead_to_won
    FROM fct_funnel_conversion
    WHERE event_month >= DATE '2025-05-01'
    GROUP BY 1, 2 ORDER BY lead_to_won DESC NULLS LAST`);
  return r.map(x => ({
    demand_source: x.demand_source, segment: x.segment,
    leads: num(x.leads), opps: num(x.opps), won: num(x.won),
    won_keur: x.won_keur != null ? num(x.won_keur) : null,
    lead_to_won: x.lead_to_won != null ? num(x.lead_to_won) : null,
  }));
}

async function buildSlippageTrend(conn) {
  const r = await rows(conn, `
    SELECT cast(snapshot_month AS varchar) AS snapshot_month,
           count(*) FILTER (WHERE close_date_slippage_days > 0)::int AS deals_slipped,
           count(*)::int AS total_deals,
           round(sum(arr_at_snapshot) FILTER (WHERE close_date_slippage_days > 0)/1000, 0) AS slipped_keur,
           round(
             100.0 * count(*) FILTER (WHERE close_date_slippage_days > 0)
             / nullif(count(*), 0), 1
           ) AS slip_rate
    FROM int_pipeline_stage_history
    WHERE snapshot_month >= DATE '2025-09-01'
    GROUP BY 1 ORDER BY 1`);
  return r.map(x => ({
    snapshot_month: x.snapshot_month,
    deals_slipped:  num(x.deals_slipped),
    total_deals:    num(x.total_deals),
    slipped_keur:   x.slipped_keur != null ? num(x.slipped_keur) : null,
    slip_rate:      x.slip_rate != null ? num(x.slip_rate) : null,
  }));
}

async function buildRepTable(conn) {
  // Q1 attainment per rep, Q2 attainment per rep (through May 14), merged.
  const q1 = await rows(conn, `
    SELECT rep_id, rep_name,
           sum(closed_won_arr_eur) AS won,
           sum(effective_monthly_target_eur) AS tgt
    FROM fct_rep_attainment WHERE quarter = 'Q1 2026'
    GROUP BY 1, 2`);
  const q2 = await rows(conn, `
    SELECT rep_id, rep_name, market, segment, team,
           sum(closed_won_arr_eur) AS won,
           sum(effective_monthly_target_eur) AS tgt
    FROM fct_rep_attainment
    WHERE quarter = 'Q2 2026' AND target_month <= DATE '2026-05-31'
    GROUP BY 1, 2, 3, 4, 5`);

  const q1Att = Object.fromEntries(q1.map(r => {
    const tgt = num(r.tgt), won = num(r.won);
    return [r.rep_id, tgt > 0 ? Math.round(won / tgt * 100) : 0];
  }));

  const merged = q2.map(r => {
    const tgt = num(r.tgt), won = num(r.won);
    return {
      rep_name: r.rep_name, market: r.market, segment: r.segment, team: r.team,
      tgt_eur: tgt, won_eur: won,
      q1_att: q1Att[r.rep_id] ?? 0,
      q2_att: tgt > 0 ? Math.round(won / tgt * 100) : 0,
    };
  });
  merged.sort((a, b) => (b.q1_att - a.q1_att) || (b.q2_att - a.q2_att));
  return merged;
}

async function buildPipeByMarket(conn) {
  const r = await rows(conn, `
    SELECT market, segment, count(*)::int AS open_deals,
           round(sum(arr_eur)/1000, 0) AS arr_keur,
           round(sum(weighted_arr_eur)/1000, 0) AS weighted_keur,
           count(*) FILTER (WHERE is_stale)::int AS stale_deals,
           round(coalesce(sum(arr_eur) FILTER (WHERE is_stale), 0)/1000, 0) AS stale_keur
    FROM fct_pipeline_health GROUP BY 1, 2 ORDER BY arr_keur DESC`);
  return r.map(x => ({
    market: x.market, segment: x.segment,
    open_deals: num(x.open_deals), arr_keur: num(x.arr_keur),
    weighted_keur: num(x.weighted_keur), stale_deals: num(x.stale_deals),
    stale_keur: num(x.stale_keur),
  }));
}

async function buildDrift(conn) {
  const r = await rows(conn, `
    SELECT 'Accounts — market label drift' AS field,
           count(*) FILTER (WHERE market_drift)::int AS drift_rows,
           count(*)::int AS total
      FROM dim_accounts
    UNION ALL SELECT 'Accounts — segment drift',
      count(*) FILTER (WHERE segment_drift)::int, count(*)::int FROM dim_accounts
    UNION ALL SELECT 'Accounts — country drift',
      count(*) FILTER (WHERE country_drift)::int, count(*)::int FROM dim_accounts
    UNION ALL SELECT 'Opportunities — stage drift',
      count(*) FILTER (WHERE stage_drift)::int, count(*)::int FROM fct_opportunities
    UNION ALL SELECT 'Opportunities — demand source drift',
      count(*) FILTER (WHERE demand_source_drift)::int, count(*)::int FROM fct_opportunities`);
  return r.map(x => ({ field: x.field, drift_rows: num(x.drift_rows), total: num(x.total) }));
}

async function buildCumulativeArr(conn) {
  const r = await rows(conn, `
    SELECT cast(month AS varchar) AS month,
           coalesce(new_arr_eur, 0)        AS new_arr_eur,
           coalesce(cumulative_arr_eur, 0) AS cumulative_arr_eur
    FROM fct_monthly_arr
    WHERE month >= DATE '2024-01-01' AND month <= DATE '2026-06-01'
    ORDER BY month`);
  return r.map(x => ({
    month: x.month,
    new_arr_eur: num(x.new_arr_eur),
    cumulative_arr_eur: num(x.cumulative_arr_eur),
  }));
}

// Recommendations are advisory, not data — they don't change row-by-row.

// ── Entry point ─────────────────────────────────────────────────────────────

async function loadData() {
  const db = await bootDuckDB();
  const conn = await mountTables(db);

  // Run every section query in parallel — each one is independent.
  const [
    hero, trend, pipelineQuality, qualityFlags, aspBySource, velocity,
    topStale, staleBySegment, funnel, funnelBySource, slippageTrend,
    rep, pipeByMarket, drift, cumulativeArr
  ] = await Promise.all([
    buildHero(conn),
    buildTrend(conn),
    buildPipelineQuality(conn),
    buildQualityFlags(conn),
    buildAspBySource(conn),
    buildVelocity(conn),
    buildTopStale(conn),
    buildStaleBySegment(conn),
    buildFunnel(conn),
    buildFunnelBySource(conn),
    buildSlippageTrend(conn),
    buildRepTable(conn),
    buildPipeByMarket(conn),
    buildDrift(conn),
    buildCumulativeArr(conn),
  ]);

  return {
    hero, trend, pipelineQuality, qualityFlags, aspBySource, velocity,
    topStale, staleBySegment, funnel, funnelBySource, slippageTrend,
    rep, pipeByMarket, drift, cumulativeArr,
    actions: buildActions(hero),
  };
}


const loader = document.getElementById('loader');
const loaderMsg = document.getElementById('loader-msg');

function setLoader(msg, isError = false) {
  loaderMsg.textContent = msg;
  if (isError) loader.classList.add('err');
}

try {
  setLoader('Booting DuckDB-WASM…');
  window.DATA = await loadData();
  setLoader('Rendering dashboard…');

  // 2) Inject the React app only after window.DATA exists. Babel-standalone
  //    auto-runs <script type="text/babel"> tags it finds at load time;
  //    since we deferred ours via type="text/plain", trigger a manual transform.
  const jsxSource = document.getElementById('app-jsx').textContent;
  const transformed = Babel.transform(jsxSource, { presets: ['react'] }).code;
  const s = document.createElement('script');
  s.textContent = transformed;
  document.body.appendChild(s);

  loader.remove();
} catch (e) {
  console.error(e);
  setLoader('Could not load data — ' + e.message + ' (open devtools for details)', true);
}
